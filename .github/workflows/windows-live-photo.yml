name: Build Live Photo Maker for Windows
on:
  push:
    branches: [main]
    paths:
      - 'windows-live-photo/**'
      - '.github/workflows/windows-live-photo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: windows-live-photo
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Test conversions and matching metadata
        working-directory: windows-live-photo
        run: python -m unittest discover -s tests -v
      - name: Build executable
        working-directory: windows-live-photo
        run: pyinstaller --noconfirm --clean --onefile --windowed --name LivePhotoMaker --collect-all tkinterdnd2 --collect-all pillow_heif --collect-all imageio_ffmpeg --add-data "trajectory.json;." --add-data "metadata-track.bin;." app.py
      - name: Test executable startup
        working-directory: windows-live-photo
        shell: pwsh
        run: |
          $p = Start-Process -FilePath 'dist/LivePhotoMaker.exe' -ArgumentList '--self-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Executable self-test failed: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: LivePhotoMaker-Windows
          path: windows-live-photo/dist/LivePhotoMaker.exe
          if-no-files-found: error
      - name: Publish Windows release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view live-photo-windows-latest --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create live-photo-windows-latest --repo $env:GITHUB_REPOSITORY --title '实况图制作器 Windows 版' --notes '下载 LivePhotoMaker.exe，双击运行。'
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload live-photo-windows-latest windows-live-photo/dist/LivePhotoMaker.exe --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
